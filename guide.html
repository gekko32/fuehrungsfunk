<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioguide</title>
<style>
  :root { --bg:#f6f4ef; --text:#1f2421; --muted:#5d655f; --accent:#2f6b4f; --accent-text:#fff; --card:#fff; --line:#ddd8cc; --ki:#8a5a12; --ki-bg:#fbf1de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161917; --text:#ecefea; --muted:#a3aba5; --accent:#5fae86; --accent-text:#0d1410; --card:#202421; --line:#343a36; --ki:#f0c27a; --ki-bg:#2e2617; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.55 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.5rem; line-height:1.25; margin:.5rem 0 .25rem; }
  .klein { color:var(--muted); font-size:.95rem; margin:0 0 1.25rem; }
  .liste { list-style:none; padding:0; margin:0; display:grid; gap:.6rem; }
  .liste a { display:flex; gap:.9rem; align-items:center; padding:.9rem 1rem; background:var(--card); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; }
  .nr { flex:none; width:2.4rem; height:2.4rem; border-radius:50%; background:var(--accent); color:var(--accent-text); display:grid; place-items:center; font-weight:700; }
  .titel { font-weight:600; }
  figure { margin:1rem 0; }
  figure img { width:100%; max-width:100%; height:auto; border-radius:12px; display:block; }
  figcaption { color:var(--muted); font-size:.85rem; margin-top:.35rem; }
  .ton { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:.75rem .9rem; margin:.75rem 0 1rem; }
  .ton audio { display:block; width:100%; max-width:100%; }
  .stimme { font-size:.85rem; color:var(--muted); margin-bottom:.4rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .ki { color:var(--ki); background:var(--ki-bg); border-radius:999px; padding:.1rem .6rem; font-weight:600; }
  .wahl button { font:inherit; font-size:.85rem; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:999px; padding:.15rem .7rem; cursor:pointer; }
  .wahl button[aria-pressed="true"] { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .text { white-space:pre-wrap; overflow-wrap:anywhere; }
  .quelle { color:var(--muted); font-size:.85rem; margin-top:1rem; }
  /* Früher/Heute: das frühere Bild liegt über dem heutigen und wird per Regler aufgedeckt */
  .zeitreise { position:relative; border-radius:12px; overflow:hidden; margin:1rem 0 .35rem; user-select:none; }
  .zeitreise img { display:block; width:100%; height:auto; }
  .zeitreise .oben { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; clip-path:inset(0 calc(100% - var(--pos, 50%)) 0 0); }
  .zeitreise .linie { position:absolute; top:0; bottom:0; left:var(--pos, 50%); width:3px; margin-left:-1.5px; background:#fff; box-shadow:0 0 4px rgba(0,0,0,.5); pointer-events:none; }
  .zeitreise .marke { position:absolute; top:.5rem; padding:.1rem .5rem; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; font-size:.8rem; }
  .zeitreise input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:ew-resize; margin:0; }
  nav { display:flex; gap:.5rem; margin:1.5rem 0 2rem; }
  nav a { flex:1; text-align:center; padding:.8rem; border-radius:12px; background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none; }
  nav a[hidden] { visibility:hidden; display:block !important; }
  .gesperrt { text-align:center; margin-top:30vh; }
</style>
</head>
<body>
<main id="m"><p class="klein">Lade …</p></main>
<script>
  const q = new URLSearchParams(location.search);
  const k = q.get('k'); // Vorschau für Frank
  const g = q.get('g');
  const kopf = k ? { 'X-Schluessel': k } : {};
  const medien = (d) => '/guide/medien/' + d + (k ? '?k=' + encodeURIComponent(k) : '');
  const m = document.getElementById('m');
  let daten = null;
  let stimmeWahl = null; // vom Hörer gewählte Stimme, gilt für alle Stationen

  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function laden() {
    const r = await fetch('/guide/api/stationen' + (g ? '?g=' + encodeURIComponent(g) : ''), { headers: kopf, cache: 'no-store' });
    if (r.status === 403) {
      m.innerHTML = '<div class="gesperrt"><h1>Audioguide</h1><p class="klein">Bitte scanne den QR-Code, den dir dein Guide zeigt.</p></div>';
      return;
    }
    daten = await r.json();
    document.title = daten.guide.titel;
    zeigen();
  }

  function bild(b) {
    return '<figure><img loading="lazy" alt="' + esc(b.text) + '" src="' + medien(b.datei) + '">' + (b.text ? '<figcaption>' + esc(b.text) + '</figcaption>' : '') + '</figure>';
  }

  function ton(s) {
    const da = ['sprecher', 'ki'].filter((x) => s.ton[x]);
    if (!da.length) return '';
    const stimme = da.includes(stimmeWahl) ? stimmeWahl : da[0];
    const name = { sprecher: 'Originalstimme', ki: 'KI-Stimme' };
    const wahl = da.length > 1
      ? '<span class="wahl">' + da.map((x) => '<button data-stimme="' + x + '" aria-pressed="' + (x === stimme) + '">' + name[x] + '</button>').join(' ') + '</span>'
      : '';
    const hinweis = stimme === 'ki' ? '<span class="ki">Gelesen von einer KI-Stimme</span>' : '';
    return '<div class="ton"><div class="stimme">' + (hinweis || 'Zum Anhören') + wahl + '</div><audio controls preload="metadata" src="' + medien(s.ton[stimme]) + '"></audio></div>';
  }

  function zeitreise(z) {
    if (!z || !z.frueher || !z.heute || z.art !== 'bild') return '';
    return '<div class="zeitreise" style="--pos:50%">' +
      '<img src="' + medien(z.heute.datei) + '" alt="' + esc(z.heute.text || 'Heute') + '">' +
      '<img class="oben" src="' + medien(z.frueher.datei) + '" alt="' + esc(z.frueher.text || 'Früher') + '">' +
      '<span class="linie"></span><span class="marke" style="left:.5rem">Früher</span><span class="marke" style="right:.5rem">Heute</span>' +
      '<input type="range" min="0" max="100" value="50" aria-label="Früher und heute vergleichen"></div>' +
      '<figcaption>' + esc([z.frueher.text, z.heute.text].filter(Boolean).join(' · ') || 'Regler ziehen: früher und heute') + '</figcaption>';
  }

  function zeigen() {
    const st = daten.stationen;
    const id = location.hash.startsWith('#s/') ? location.hash.slice(3) : null;
    const i = st.findIndex((s) => s.id === id);
    if (i < 0) {
      const bis = daten.bis ? 'Freigeschaltet bis ' + new Date(daten.bis).toLocaleString('de-DE', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + ' Uhr' : 'Vorschau';
      m.innerHTML = '<h1>' + esc(daten.guide.titel) + '</h1>' +
        (daten.guide.beschreibung ? '<p>' + esc(daten.guide.beschreibung) + '</p>' : '') +
        '<p class="klein">' + bis + '</p><ul class="liste">' +
        st.map((s, n) => '<li><a href="#s/' + s.id + '"><span class="nr">' + (n + 1) + '</span><span class="titel">' + esc(s.titel) + '</span></a></li>').join('') +
        '</ul>' + (st.length ? '' : '<p class="klein">Noch keine Stationen.</p>');
      return;
    }
    const s = st[i];
    m.innerHTML =
      '<p class="klein"><a href="#" style="color:inherit">← Alle Stationen</a></p>' +
      '<h1>' + (i + 1) + ' · ' + esc(s.titel) + '</h1>' +
      ton(s) +
      (s.fotos[0] ? bild(s.fotos[0]) : '') +
      zeitreise(s.zeitreise) +
      '<div class="text">' + esc(s.text) + '</div>' +
      s.fotos.slice(1).map(bild).join('') +
      (s.quelle ? '<p class="quelle">Quelle: ' + esc(s.quelle) + '</p>' : '') +
      '<nav><a href="#s/' + (st[i - 1] || {}).id + '"' + (i ? '' : ' hidden') + '>← Zurück</a>' +
      '<a href="#s/' + (st[i + 1] || {}).id + '"' + (i < st.length - 1 ? '' : ' hidden') + '>Weiter →</a></nav>';
  }

  m.addEventListener('input', (e) => {
    if (e.target.closest('.zeitreise')) e.target.parentNode.style.setProperty('--pos', e.target.value + '%');
  });
  m.addEventListener('click', (e) => {
    const b = e.target.closest('[data-stimme]');
    if (b) { stimmeWahl = b.dataset.stimme; const y = scrollY; zeigen(); scrollTo(0, y); }
  });
  window.addEventListener('hashchange', () => { if (daten) { zeigen(); scrollTo(0, 0); } });
  laden();
</script>
</body>
</html>
