<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioguide</title>
<style>
  :root { --bg:#f6f4ef; --text:#1f2421; --muted:#5d655f; --accent:#2f6b4f; --accent-text:#fff; --card:#fff; --line:#ddd8cc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161917; --text:#ecefea; --muted:#a3aba5; --accent:#5fae86; --accent-text:#0d1410; --card:#202421; --line:#343a36; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.5rem; margin:.5rem 0 .25rem; }
  .klein { color:var(--muted); font-size:.95rem; margin:0 0 1.25rem; }
  .liste { list-style:none; padding:0; margin:0; display:grid; gap:.6rem; }
  .liste a { display:flex; gap:.9rem; align-items:center; padding:.9rem 1rem; background:var(--card); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; }
  .nr { flex:none; width:2.4rem; height:2.4rem; border-radius:50%; background:var(--accent); color:var(--accent-text); display:grid; place-items:center; font-weight:700; }
  .titel { font-weight:600; }
  .fotos { display:grid; grid-template-columns:minmax(0,1fr); gap:.5rem; margin:1rem 0; }
  .fotos img { width:100%; max-width:100%; height:auto; border-radius:12px; display:block; }
  audio { display:block; width:100%; max-width:100%; margin:.75rem 0 1rem; }
  .text { white-space:pre-wrap; }
  nav { display:flex; gap:.5rem; margin:1.5rem 0 2rem; }
  nav a { flex:1; text-align:center; padding:.8rem; border-radius:12px; background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none; }
  nav a[hidden] { visibility:hidden; display:block; }
  .text { overflow-wrap:anywhere; }
  .gesperrt { text-align:center; margin-top:30vh; }
</style>
</head>
<body>
<main id="m"><p class="klein">Lade …</p></main>
<script>
  const k = new URLSearchParams(location.search).get('k'); // Vorschau für Frank
  const kopf = k ? { 'X-Schluessel': k } : {};
  const medien = (d) => '/guide/medien/' + d + (k ? '?k=' + encodeURIComponent(k) : '');
  const m = document.getElementById('m');
  let daten = null;

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function laden() {
    const r = await fetch('/guide/api/stationen', { headers: kopf, cache: 'no-store' });
    if (r.status === 403) {
      m.innerHTML = '<div class="gesperrt"><h1>Audioguide</h1><p class="klein">Bitte scanne den QR-Code, den dir dein Guide zeigt.</p></div>';
      return;
    }
    daten = await r.json();
    zeigen();
  }

  function zeigen() {
    const st = daten.stationen;
    const id = location.hash.startsWith('#s/') ? location.hash.slice(3) : null;
    const i = st.findIndex((s) => s.id === id);
    window.scrollTo(0, 0);
    if (i < 0) {
      const bis = daten.bis ? 'Freigeschaltet bis ' + new Date(daten.bis).toLocaleString('de-DE', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + ' Uhr' : 'Vorschau';
      m.innerHTML = '<h1>Audioguide</h1><p class="klein">' + bis + '</p><ul class="liste">' +
        st.map((s, n) => '<li><a href="#s/' + s.id + '"><span class="nr">' + (n + 1) + '</span><span class="titel">' + esc(s.titel) + '</span></a></li>').join('') +
        '</ul>' + (st.length ? '' : '<p class="klein">Noch keine Stationen.</p>');
      return;
    }
    const s = st[i];
    m.innerHTML =
      '<p class="klein"><a href="#" style="color:inherit">← Alle Stationen</a></p>' +
      '<h1>' + (i + 1) + ' · ' + esc(s.titel) + '</h1>' +
      (s.audio ? '<audio controls preload="metadata" src="' + medien(s.audio) + '"></audio>' : '') +
      (s.fotos.length ? '<div class="fotos">' + s.fotos.map((f) => '<img loading="lazy" alt="" src="' + medien(f) + '">').join('') + '</div>' : '') +
      '<div class="text">' + esc(s.text) + '</div>' +
      '<nav><a href="#s/' + (st[i - 1] || {}).id + '"' + (i ? '' : ' hidden') + '>← Zurück</a>' +
      '<a href="#s/' + (st[i + 1] || {}).id + '"' + (i < st.length - 1 ? '' : ' hidden') + '>Weiter →</a></nav>';
  }

  window.addEventListener('hashchange', () => daten && zeigen());
  laden();
</script>
</body>
</html>
