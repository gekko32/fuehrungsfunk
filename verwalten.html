<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioguide verwalten</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#f6f4ef; --text:#1f2421; --muted:#5d655f; --accent:#2f6b4f; --accent-text:#fff; --stop:#b3392f; --card:#fff; --line:#ddd8cc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161917; --text:#ecefea; --muted:#a3aba5; --accent:#5fae86; --accent-text:#0d1410; --stop:#d0574c; --card:#202421; --line:#343a36; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.45 system-ui, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:.5rem 0 1rem; }
  h2 { font-size:1.15rem; margin:2rem 0 .75rem; }
  h3 { font-size:.95rem; margin:1rem 0 .25rem; }
  section.karte, .station { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; margin-bottom:.9rem; }
  button, .knopf { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:.55rem .9rem; cursor:pointer; text-decoration:none; }
  button.haupt { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  button.rot { color:var(--stop); }
  button.aufnahme { background:var(--stop); color:#fff; border-color:var(--stop); }
  input[type=text], textarea, select { font:inherit; width:100%; padding:.55rem .7rem; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  textarea { min-height:8rem; resize:vertical; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:.75rem 0 .25rem; }
  .zeile { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .kopf { display:flex; gap:.6rem; align-items:center; }
  .kopf .nr { flex:none; width:2.2rem; height:2.2rem; border-radius:50%; background:var(--accent); color:var(--accent-text); display:grid; place-items:center; font-weight:700; }
  .kopf input { flex:1; font-weight:600; }
  audio { width:100%; margin:.25rem 0; }
  .spur { border-top:1px solid var(--line); padding-top:.5rem; margin-top:.5rem; }
  .bilder { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:.6rem; }
  .bild { position:relative; }
  .bild img { width:100%; height:100px; object-fit:cover; border-radius:8px; display:block; }
  .bild > button { position:absolute; top:4px; right:4px; padding:.1rem .45rem; }
  .bild input { font-size:.8rem; padding:.3rem .45rem; margin-top:.25rem; }
  .leer { margin:0; height:100px; border:2px dashed var(--line); border-radius:8px; display:grid; place-items:center; color:var(--muted); font-size:.85rem; text-align:center; padding:.3rem; }
  .hinweis { color:var(--muted); font-size:.85rem; min-height:1.2em; }
  .qr { background:#fff; padding:14px; border-radius:12px; display:inline-block; margin-top:1rem; }
  .code { font-size:1.6rem; letter-spacing:.15em; font-weight:700; margin-top:.5rem; }
  .datei { position:relative; overflow:hidden; display:inline-block; }
  .datei input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  ul.runden { padding-left:1.1rem; }
</style>
</head>
<body>
<main>
  <h1>Audioguide verwalten</h1>

  <section class="karte">
    <label for="guideWahl" style="margin-top:0">Welcher Guide?</label>
    <div class="zeile">
      <select id="guideWahl" style="flex:1; width:auto"></select>
      <button id="neuerGuide">+ Neuer Guide</button>
    </div>
    <label for="guideTitel">Titel (sehen die Teilnehmer oben)</label>
    <input type="text" id="guideTitel">
    <label for="guideText">Kurzbeschreibung</label>
    <textarea id="guideText" style="min-height:4rem"></textarea>
    <div class="hinweis" id="guideHinweis"></div>
    <div class="zeile">
      <a class="knopf" id="vorschau" target="_blank">Ansicht der Teilnehmer</a>
      <span style="flex:1"></span>
      <button class="rot" id="guideWeg">Guide löschen</button>
    </div>
  </section>

  <section class="karte">
    <strong>Runde freischalten</strong>
    <p class="hinweis">Für jede Führung neu. Der Code schaltet den oben gewählten Guide frei, so lange die Runde gilt.</p>
    <div class="zeile">
      <select id="dauer" style="width:auto">
        <option value="4">4 Stunden</option>
        <option value="24" selected>bis morgen (24 Std.)</option>
        <option value="168">1 Woche</option>
      </select>
      <button class="haupt" id="neueRunde">Neue Runde</button>
    </div>
    <div id="rundeAnzeige"></div>
    <ul class="runden" id="runden"></ul>
  </section>

  <h2>Stationen</h2>
  <div id="stationen"></div>
  <div class="zeile">
    <button class="haupt" id="neu">+ Station hinzufügen</button>
  </div>
</main>
<script>
  const k = new URLSearchParams(location.search).get('k');
  const H = { 'X-Schluessel': k };
  const medien = (d) => '/guide/medien/' + d + '?k=' + encodeURIComponent(k);
  let guides = [], gid = null, st = [];

  async function api(methode, pfad, body, typ) {
    const r = await fetch('/guide/api/' + pfad, { method: methode, headers: { ...H, ...(typ ? { 'Content-Type': typ } : {}) }, body });
    const d = await r.json();
    if (!r.ok) throw new Error(d.fehler || 'Fehler');
    return d;
  }
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);

  // ---------- Guides ----------
  async function guidesLaden(wahl) {
    guides = await api('GET', 'guides');
    gid = wahl || (guides.some((g) => g.id === gid) ? gid : (localStorage.getItem('guide') || '')) ;
    if (!guides.some((g) => g.id === gid)) gid = guides[0].id;
    $('guideWahl').innerHTML = guides.map((g) => '<option value="' + g.id + '"' + (g.id === gid ? ' selected' : '') + '>' + esc(g.titel) + ' (' + g.anzahl + ')</option>').join('');
    const g = guides.find((x) => x.id === gid);
    $('guideTitel').value = g.titel; $('guideText').value = g.beschreibung || '';
    $('vorschau').href = '/guide?k=' + encodeURIComponent(k) + '&g=' + gid;
    $('guideWeg').disabled = guides.length < 2;
    try { localStorage.setItem('guide', gid); } catch {}
    await laden(); rundenLaden();
  }
  $('guideWahl').onchange = (e) => { $('rundeAnzeige').innerHTML = ''; guidesLaden(e.target.value); };
  $('neuerGuide').onclick = async () => { const g = await api('POST', 'guide', JSON.stringify({ titel: 'Neuer Guide' }), 'application/json'); guidesLaden(g.id); };
  for (const [feld, el] of [['titel', 'guideTitel'], ['beschreibung', 'guideText']]) {
    $(el).onchange = async () => {
      try { await api('PUT', 'guide/' + gid, JSON.stringify({ [feld]: $(el).value }), 'application/json'); $('guideHinweis').textContent = 'Gespeichert.'; guidesLaden(gid); }
      catch (x) { $('guideHinweis').textContent = 'Nicht gespeichert: ' + x.message; }
    };
  }
  $('guideWeg').onclick = async () => {
    const g = guides.find((x) => x.id === gid);
    if (!confirm('Guide „' + g.titel + '“ mit allen ' + g.anzahl + ' Stationen, Tönen und Fotos löschen?')) return;
    await api('DELETE', 'guide/' + gid); gid = null; guidesLaden();
  };

  // ---------- Runden ----------
  const uhr = (t) => new Date(t).toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const guideName = (id) => (guides.find((g) => g.id === id) || { titel: '?' }).titel;
  async function rundenLaden() {
    const r = await api('GET', 'runden');
    $('runden').innerHTML = r.map((x) =>
      '<li>' + x.code + ' – ' + esc(guideName(x.guide)) + ', gilt bis ' + uhr(x.bis) + ' <button class="rot" data-code="' + x.code + '">beenden</button> <button data-zeige="' + x.code + '">QR zeigen</button></li>').join('');
  }
  function qrZeigen(code) {
    const link = location.origin + '/g/' + code;
    $('rundeAnzeige').innerHTML = '<div class="qr" id="qr"></div><div class="code">' + code + '</div><div class="hinweis">' + link + '</div>';
    new QRCode($('qr'), { text: link, width: 220, height: 220 });
  }
  $('neueRunde').onclick = async () => {
    const r = await api('POST', 'runde', JSON.stringify({ stunden: Number($('dauer').value), guide: gid }), 'application/json');
    qrZeigen(r.code); rundenLaden();
  };
  $('runden').onclick = async (e) => {
    if (e.target.dataset.code) { await api('DELETE', 'runde/' + e.target.dataset.code); $('rundeAnzeige').innerHTML = ''; rundenLaden(); }
    if (e.target.dataset.zeige) qrZeigen(e.target.dataset.zeige);
  };

  // ---------- Stationen ----------
  async function laden() { st = (await api('GET', 'stationen?g=' + gid)).stationen; zeichnen(); }

  const spur = (s, stimme, name, erklaerung) => `
    <div class="spur">
      <h3>${name}</h3>
      <div class="hinweis">${erklaerung}</div>
      ${s.ton[stimme] ? `<audio controls preload="none" src="${medien(s.ton[stimme])}"></audio>` : '<div class="hinweis">Noch keine Aufnahme.</div>'}
      <div class="zeile">
        ${stimme === 'sprecher' ? '<button data-tun="aufnehmen">● Aufnehmen</button>' : ''}
        <span class="knopf datei">Datei wählen<input type="file" accept="audio/*" data-tun="tondatei" data-stimme="${stimme}"></span>
        ${s.ton[stimme] ? `<button class="rot" data-tun="tonweg" data-stimme="${stimme}">Löschen</button>` : ''}
      </div>
    </div>`;

  const bildKachel = (b, wegTun, extra) => `
    <div class="bild"><img src="${medien(b.datei)}" alt="">
      <button class="rot" data-tun="${wegTun}" ${extra} aria-label="Bild löschen">×</button>
      <input type="text" data-bildtext="${b.datei}" value="${esc(b.text)}" placeholder="Bildunterschrift" aria-label="Bildunterschrift"></div>`;

  const zeitPlatz = (s, seite, name) => s.zeitreise[seite]
    ? bildKachel(s.zeitreise[seite], 'zeitweg', `data-seite="${seite}"`)
    : `<label class="leer datei">+ ${name}<input type="file" accept="image/*" data-tun="zeitbild" data-seite="${seite}"></label>`;

  function zeichnen() {
    $('stationen').innerHTML = st.map((s, i) => `
      <div class="station" data-id="${s.id}">
        <div class="kopf"><span class="nr">${i + 1}</span><input type="text" data-feld="titel" value="${esc(s.titel)}" aria-label="Titel"></div>
        <label>Text (wird angezeigt und ist zugleich die Vorlage zum Vorlesen)</label>
        <textarea data-feld="text">${esc(s.text)}</textarea>
        <label>Quelle</label>
        <input type="text" data-feld="quelle" value="${esc(s.quelle)}" placeholder="z. B. Buch, Kapitel 3">
        ${spur(s, 'sprecher', 'Ton: Originalstimme', 'Wird bevorzugt abgespielt.')}
        ${spur(s, 'ki', 'Ton: KI-Stimme', 'Übergangsweise; die Teilnehmer sehen den Hinweis „Gelesen von einer KI-Stimme“.')}
        <div class="spur">
          <h3>Fotos (höchstens 3)</h3>
          <div class="bilder">
            ${s.fotos.map((f) => bildKachel(f, 'fotoweg', `data-foto="${f.datei}"`)).join('')}
            ${s.fotos.length < 3 ? '<label class="leer datei">+ Foto<input type="file" accept="image/*" data-tun="foto"></label>' : ''}
          </div>
        </div>
        <div class="spur">
          <h3>Früher / Heute</h3>
          <div class="hinweis">Zwei Bilder vom gleichen Standpunkt. Die Teilnehmer schieben einen Regler zwischen beiden hin und her.</div>
          <div class="bilder">${zeitPlatz(s, 'frueher', 'Früher')}${zeitPlatz(s, 'heute', 'Heute')}</div>
        </div>
        <div class="hinweis" data-hinweis></div>
        <div class="zeile" style="margin-top:.5rem">
          <button data-tun="hoch" ${i ? '' : 'disabled'}>↑</button>
          <button data-tun="runter" ${i < st.length - 1 ? '' : 'disabled'}>↓</button>
          <span style="flex:1"></span>
          <button class="rot" data-tun="loeschen">Station löschen</button>
        </div>
      </div>`).join('');
  }

  const karte = (el) => el.closest('.station');
  const hinweis = (el, t) => { karte(el).querySelector('[data-hinweis]').textContent = t; };
  const ersetzen = (s) => { st[st.findIndex((x) => x.id === s.id)] = s; zeichnen(); };
  const speichern = async (el, id, daten) => {
    try { const s = await api('PUT', 'station/' + id, JSON.stringify(daten), 'application/json'); st[st.findIndex((x) => x.id === id)] = s; hinweis(el, 'Gespeichert.'); }
    catch (x) { hinweis(el, 'Nicht gespeichert: ' + x.message); }
  };

  // Felder speichern sich beim Verlassen.
  $('stationen').addEventListener('change', async (e) => {
    const el = e.target, id = karte(el).dataset.id;
    if (el.dataset.feld) return speichern(el, id, { [el.dataset.feld]: el.value });
    if ('bildtext' in el.dataset) return speichern(el, id, { bildtexte: { [el.dataset.bildtext]: el.value } });
    const datei = el.files && el.files[0];
    if (!datei) return;
    try {
      if (el.dataset.tun === 'tondatei') { hinweis(el, 'Lade Ton hoch …'); return tonHoch(id, el.dataset.stimme, datei, el); }
      if (el.dataset.tun === 'foto') { hinweis(el, 'Lade Foto hoch …'); ersetzen(await api('POST', 'station/' + id + '/foto', await verkleinern(datei), 'image/jpeg')); }
      if (el.dataset.tun === 'zeitbild') { hinweis(el, 'Lade Bild hoch …'); ersetzen(await api('PUT', 'station/' + id + '/zeitreise/' + el.dataset.seite, await verkleinern(datei), 'image/jpeg')); }
    } catch (x) { hinweis(el, 'Hochladen ging nicht: ' + x.message); }
  });

  async function tonHoch(id, stimme, blob, el) {
    try { ersetzen(await api('PUT', 'station/' + id + '/ton/' + stimme, blob, blob.type || 'application/octet-stream')); }
    catch (x) { hinweis(el, 'Ton ging nicht: ' + x.message); }
  }

  // Bilder im Browser verkleinern; das spart Datenvolumen und entfernt Standortdaten.
  async function verkleinern(datei) {
    const bild = await createImageBitmap(datei);
    const f = Math.min(1, 1600 / Math.max(bild.width, bild.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
    c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
    return new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.82));
  }

  let rec = null;
  $('stationen').addEventListener('click', async (e) => {
    const el = e.target.closest('button'); if (!el || !el.dataset.tun) return;
    const id = karte(el).dataset.id, i = st.findIndex((x) => x.id === id);
    const tun = el.dataset.tun;

    if (tun === 'aufnehmen') {
      if (rec) return;
      const strom = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const typ = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'].find((t) => MediaRecorder.isTypeSupported(t));
      const teile = [];
      rec = new MediaRecorder(strom, typ ? { mimeType: typ } : {});
      rec.ondataavailable = (x) => teile.push(x.data);
      rec.onstop = () => {
        strom.getTracks().forEach((t) => t.stop());
        const blob = new Blob(teile, { type: rec.mimeType });
        rec = null;
        const url = URL.createObjectURL(blob);
        const h = karte(el).querySelector('[data-hinweis]');
        h.innerHTML = 'Probehören: <audio controls src="' + url + '"></audio><div class="zeile"><button class="haupt" data-ok>Speichern</button><button data-weg>Verwerfen</button></div>';
        h.querySelector('[data-ok]').onclick = () => { h.textContent = 'Speichere …'; tonHoch(id, 'sprecher', blob, el); };
        h.querySelector('[data-weg]').onclick = () => { h.textContent = ''; zeichnen(); };
      };
      rec.start();
      const start = Date.now();
      el.classList.add('aufnahme'); el.dataset.tun = 'stopp';
      const zeit = setInterval(() => { if (!rec) return clearInterval(zeit); const s = Math.floor((Date.now() - start) / 1000); el.textContent = '■ Stopp ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 250);
      return;
    }
    if (tun === 'stopp') { rec && rec.stop(); return; }
    if (tun === 'tonweg' && confirm('Aufnahme wirklich löschen?')) ersetzen(await api('DELETE', 'station/' + id + '/ton/' + el.dataset.stimme));
    if (tun === 'fotoweg') ersetzen(await api('DELETE', 'station/' + id + '/foto/' + el.dataset.foto));
    if (tun === 'zeitweg') ersetzen(await api('DELETE', 'station/' + id + '/zeitreise/' + el.dataset.seite));
    if (tun === 'loeschen' && confirm('Station „' + st[i].titel + '“ mit Ton und Fotos löschen?')) { await api('DELETE', 'station/' + id); guidesLaden(gid); }
    if (tun === 'hoch' || tun === 'runter') {
      const j = tun === 'hoch' ? i - 1 : i + 1;
      [st[i], st[j]] = [st[j], st[i]];
      await api('PUT', 'reihenfolge', JSON.stringify({ guide: gid, ids: st.map((x) => x.id) }), 'application/json');
      zeichnen();
    }
  });

  $('neu').onclick = async () => { await api('POST', 'station', JSON.stringify({ guide: gid }), 'application/json'); guidesLaden(gid); };

  guidesLaden();
</script>
</body>
</html>
