<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Führung hören</title>
<style>
  :root { --bg:#f6f4ef; --text:#1f2421; --muted:#5d655f; --accent:#2f6b4f; --accent-text:#fff; --card:#fff; --line:#ddd8cc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161917; --text:#ecefea; --muted:#a3aba5; --accent:#5fae86; --accent-text:#0d1410; --card:#202421; --line:#343a36; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.45 system-ui, sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  main { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  p { color:var(--muted); margin:.25rem 0 1.5rem; }
  button { width:100%; border:0; border-radius:16px; padding:1.4rem 1rem; font-size:1.4rem; font-weight:600; background:var(--accent); color:var(--accent-text); cursor:pointer; }
  button.leise { background:var(--card); color:var(--text); border:1px solid var(--line); font-size:1rem; padding:.9rem; margin-top:.75rem; font-weight:500; }
  #status { margin-top:1.25rem; font-size:1rem; }
  .punkt { display:inline-block; width:.7em; height:.7em; border-radius:50%; background:#999; margin-right:.4em; vertical-align:middle; }
  .live .punkt { background:#d33; animation:p 1.2s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  small { display:block; margin-top:2rem; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Führung hören</h1>
  <p>Auf „Zuhören“ tippen. Mit Kopfhörern versteht man am besten.</p>
  <button id="play">▶ Zuhören</button>
  <button id="neu" class="leise" hidden>Neu verbinden (falls es hinterherhängt)</button>
  <div id="status"><span class="punkt"></span><span id="st">Prüfe …</span></div>
  <small>Der Bildschirm darf aus sein, der Ton läuft weiter.</small>
  <small id="puf" style="margin-top:.5rem"></small>
  <audio id="a" preload="none"></audio>
</main>
<script>
  const a = document.getElementById('a'), play = document.getElementById('play'), neu = document.getElementById('neu');
  const box = document.getElementById('status'), st = document.getElementById('st'), puf = document.getElementById('puf');
  let an = false, ws = null, sb = null, url = null, puffer = [], neuTimer = null, wachTimer = null;

  // Bevorzugt: Ton per WebSocket in einen MediaSource-Puffer. Das umgeht Puffer im Tunnel,
  // und wir können den Rückstand selbst klein halten. Sonst klassisch per <audio src>.
  const MS = window.ManagedMediaSource || window.MediaSource;
  const mitMse = !!(MS && MS.isTypeSupported && MS.isTypeSupported('audio/mpeg'));

  function aufraeumen() {
    clearTimeout(neuTimer); clearInterval(wachTimer);
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    sb = null; puffer = [];
    a.pause(); a.removeAttribute('src'); a.load();
    if (url) { URL.revokeObjectURL(url); url = null; }
  }

  function starten() {
    aufraeumen();
    an = true; play.textContent = '■ Stopp'; neu.hidden = false;
    if (!mitMse) {
      // Rückfallweg (z. B. Firefox auf Android): normaler Audio-Strom. Der Browser puffert
      // selbst vor; wie beim MediaSource-Weg nach vorn springen, sobald mehr als 1,5 s anstehen.
      a.src = '/stream?t=' + Date.now(); a.play().catch(() => {});
      wachTimer = setInterval(() => {
        const b = a.buffered;
        if (!b.length) return;
        const ende = b.end(b.length - 1);
        if (ende - a.currentTime > 1.5) a.currentTime = ende - 0.5;
        puf.textContent = 'Puffer im Gerät: ' + Math.max(0, ende - a.currentTime).toFixed(1) + ' s';
      }, 1000);
      return;
    }
    const ms = new MS();
    a.disableRemotePlayback = true;
    url = URL.createObjectURL(ms); a.src = url;
    ms.addEventListener('sourceopen', () => {
      sb = ms.addSourceBuffer('audio/mpeg');
      sb.mode = 'sequence';
      sb.addEventListener('updateend', nachschieben);
      ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/hoer-ws');
      ws.binaryType = 'arraybuffer';
      ws.onmessage = (e) => { puffer.push(new Uint8Array(e.data)); nachschieben(); };
      ws.onclose = () => { if (an) neuTimer = setTimeout(starten, 2000); };
    }, { once: true });
    a.play().catch(() => {});
  }

  function nachschieben() {
    if (!sb || sb.updating) return;
    const b = a.buffered;
    if (b.length) {
      const ende = b.end(b.length - 1);
      // Mehr als 1,5 s Rückstand: nach vorn springen, damit sich nichts aufsummiert.
      if (ende - a.currentTime > 1.5) a.currentTime = ende - 0.5;
      puf.textContent = 'Puffer im Gerät: ' + Math.max(0, ende - a.currentTime).toFixed(1) + ' s';
      // Alten Ton aus dem Speicher werfen.
      if (a.currentTime - b.start(0) > 30) { sb.remove(0, a.currentTime - 10); return; }
    }
    if (!puffer.length) return;
    const n = puffer.reduce((s, x) => s + x.length, 0), alles = new Uint8Array(n);
    let o = 0; for (const x of puffer) { alles.set(x, o); o += x.length; }
    puffer = [];
    try { sb.appendBuffer(alles); } catch { if (an) starten(); }
    if (a.paused && an) a.play().catch(() => {});
  }

  function stoppen() {
    an = false; aufraeumen();
    play.textContent = '▶ Zuhören'; neu.hidden = true;
  }
  play.onclick = () => (an ? stoppen() : starten());
  neu.onclick = starten;
  // Abbruch (Funkloch, Sendepause): nach kurzer Zeit selbst neu verbinden.
  a.addEventListener('error', () => { if (an) neuTimer = setTimeout(starten, 2000); });
  a.addEventListener('ended', () => { if (an) neuTimer = setTimeout(starten, 2000); });

  async function pruefen() {
    try {
      const s = await (await fetch('/status', { cache: 'no-store' })).json();
      box.className = s.live ? 'live' : '';
      st.textContent = s.live ? 'Live – die Führung läuft' : 'Gerade keine Sendung';
    } catch { st.textContent = 'Keine Verbindung'; box.className = ''; }
  }
  pruefen(); setInterval(pruefen, 5000);
</script>
</body>
</html>
